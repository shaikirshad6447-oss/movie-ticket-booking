<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CineNova | Shaik Irshad</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-film"></i></div>
                <span>Cine<span class="highlight">Nova</span></span>
            </a>

            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/movies" class="nav-link">Movies</a>
                <a href="/shows" class="nav-link">Theatres & Shows</a>
            </nav>

            <div class="nav-auth">
                <a href="/register" class="btn btn-sm btn-primary">Create Account</a>
            </div>
        </div>
    </header>

    <!-- Main Auth View -->
    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-card">
                
                <div class="auth-header">
                    <div class="auth-logo">
                        <i class="fa-solid fa-film" style="color:var(--accent-red)"></i>
                        <span>Cine<span style="color:var(--accent-red)">Nova</span></span>
                    </div>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Sign in to your account to reserve movie tickets</p>
                </div>

                <form class="auth-form" id="login-form">
                    <div class="form-group">
                        <label for="login-email" class="form-label">Email Address</label>
                        <div class="input-wrap">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password" class="form-label">Password</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg auth-submit-btn">
                        Sign In
                    </button>
                </form>

                <div class="auth-footer">
                    Don't have an account yet? <a href="/register">Create one here</a>
                </div>

                <!-- Showcase Demo Credentials Switcher for Evaluators -->
                <div class="demo-accounts-box">
                    <span class="demo-title">Evaluation Demo Credentials</span>
                    <div class="demo-buttons-grid">
                        <button type="button" class="demo-btn" id="demo-admin-btn">
                            <i class="fa-solid fa-user-shield" style="color:var(--accent-gold)"></i> <strong>Admin</strong><br>
                            <small>admin@cinenova.com</small>
                        </button>
                        <button type="button" class="demo-btn" id="demo-user-btn">
                            <i class="fa-solid fa-user" style="color:#10B981"></i> <strong>Customer</strong><br>
                            <small>irshad@example.com</small>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <div>© 2026 CineNova. Project Owner: <strong>Shaik Irshad</strong>.</div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
